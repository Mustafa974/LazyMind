initial: __start__

transitions:
  __start__:
    - to: build_context
      condition: "Cold start — always enter context building first."

  build_context:
    - to: generate_outline
      condition: "Context ready — proceed to outline planning."

  generate_outline:
    - to: plan_sections
      condition: "Outline accepted — proceed to per-section instruction planning."

  plan_sections:
    - to: generate_draft
      condition: "Section instructions ready — proceed to draft writing."

  generate_draft:
    - to: review_document
      condition: "Full draft produced — proceed to review."

  review_document:
    - to: finalize_report
      condition: "Review passed — proceed to finalization."
    - to: plan_sections
      condition: "Review failed — re-plan sections to address review issues."

  finalize_report:
    - to: export_result
      condition: "Final report produced — export to Feishu if a target is configured or requested."

  export_result:
    - to: __end__
      condition: "Export result recorded — pipeline complete."

steps:
  build_context:
    label: Build Context
    prompt: |
      {{runtime_instruction}}

      本步准备 writing_task、resource_profiles、writing_context 三件产物。

      第一步：调 build_writing_task(query="{{user_input}}") 拿到 writing_task 路径，用 save_artifact(content_type='file', key='writing_task') 落库。

      第二步：调 profile_resources(writing_task_path=<writing_task 路径>, user_input="{{user_input}}") 拿到 resource_profiles 路径，用 save_artifact(content_type='file', key='resource_profiles') 落库。

      第三步：调 create_writing_context(writing_task_path=<writing_task 路径>, resource_profiles_path=<resource_profiles 路径>) 拿到 writing_context 路径，用 save_artifact(content_type='file', key='writing_context') 落库。

      如果上述工具调用失败，不要进行任何额外的兜底操作，直接停止本步骤。尤其不要自行撰写内容进行落库。
    tools:
      - build_writing_task
      - profile_resources
      - create_writing_context
    outputs:
      - slot: writing_task
      - slot: resource_profiles
      - slot: writing_context
    acceptance_criteria: |
      writing_task、resource_profiles、writing_context 三个 artifact 均已保存；writing_context.context_id 非空；document_summary.summary 非空、key_points 至少 1 条；style_profile 含 audience、formality、tone 三字段。

  generate_outline:
    label: Generate Outline
    prompt: |
      {{runtime_instruction}}

      本步基于 writing_task + writing_context 生成结构化大纲，并把大纲内容同步回写作上下文。先调 get_artifact 取回 writing_task 和 writing_context，传给 generate_outline(writing_task_path=<writing_task 路径>, writing_context_path=<writing_context 路径>)，获得 outline 路径。

      大纲生成后，调 update_writing_context(content_artifact_path=<outline 路径>, writing_context_path=<原 writing_context 路径>)，获得更新后的 writing_context 路径。

      本步骤的所有生成操作完成后，调用 save_artifact(content_type='file', key='outline') 保存 outline 路径，再调用 save_artifact(content_type='file', key='writing_context') 保存更新后的 writing_context 路径。

      如果上述工具调用失败，不要进行任何额外的兜底操作，直接停止本步骤。尤其不要自行撰写内容进行落库。
    tools:
      - generate_outline
      - update_writing_context
    exclude_framework_tools:
      - read_user_attachment
      - find_user_attachment
    inputs:
      - slot: writing_task
        required: true
      - slot: writing_context
        required: true
    outputs:
      - slot: outline
      - slot: writing_context
    acceptance_criteria: |
      outline 已保存；nodes 至少 3 个；每个 node 至少含 node_id、title、instruction、constraints 字段且非空；writing_context 已保存一次，document_summary 已反映 outline 内容。

  plan_sections:
    label: Plan Sections
    prompt: |
      {{runtime_instruction}}

      本步为大纲中的所有顶层章节一次性生成写作指令。调 get_artifact 取回 writing_context 和 outline。如果工件中已经存在 review_report，说明本步是从 review 阶段驳回后回退的重规划，需要再调一次 get_artifact(key='review_report') 把它一并带入生成过程。

      然后调用 generate_section_instructions(outline_path=<outline 路径>, writing_context_path=<writing_context 路径>, review_report_path=<review_report 路径，没有就传空字符串>)，把返回的路径用 save_artifact(content_type='file', key='section_instructions') 落库。

      如果上述工具调用失败，不要进行任何额外的兜底操作，直接停止本步骤。尤其不要自行撰写内容进行落库。
    tools:
      - generate_section_instructions
    exclude_framework_tools:
      - read_user_attachment
      - find_user_attachment
    inputs:
      - slot: outline
        required: true
      - slot: writing_context
        required: true
      - slot: review_report
        required: false
    outputs:
      - slot: section_instructions
    acceptance_criteria: |
      section_instructions 已保存；为 SectionInstructionList Artifact（data.instructions 为数组），条目数与 outline.nodes 节点数一一对应；每条至少含 outline_node_id、section_title、section_goal、required_points 字段。

  generate_draft:
    label: Generate Draft
    prompt: |
      {{runtime_instruction}}

      本步按章节顺序撰写初稿正文，最后合并成完整文档。

      先调 get_artifact 取回 writing_task、writing_context、outline 和 section_instructions 的文件路径。准备一个 draft_section_paths 列表，用来记录每次工具返回的非空章节路径。

      调 generate_draft_section(writing_task_path=<writing_task 路径>, section_instructions_path=<section_instructions 路径>, writing_context_path=<writing_context 路径>) 生成下一章。工具内部会根据已经生成的章节文件判断当前应写哪一章。工具返回非空路径时，把该路径追加到 draft_section_paths，然后继续调用同一个工具生成下一章。

      工具返回空字符串时，表示章节初稿已经全部生成完成。此时取 draft_section_paths 中最后一个路径，调用 assemble_draft_document(draft_sections_anchor_path=<最后一个 draft_section 路径>, writing_context_path=<writing_context 路径>, outline_path=<outline 路径>)，获得 draft_document 路径。

      初稿文档生成后，调 update_writing_context(content_artifact_path=<draft_document 路径>, writing_context_path=<原 writing_context 路径>)，获得更新后的 writing_context 路径。

      本步骤的所有生成操作完成后，按 draft_section_paths 中的顺序逐个调用 save_artifact(content_type='file', key='draft_sections') 保存章节初稿路径，再调用 save_artifact(content_type='file', key='draft_document') 保存 draft_document 路径，最后调用 save_artifact(content_type='file', key='writing_context') 保存更新后的 writing_context 路径。

      如果上述工具调用失败，停止本步骤并保留工具错误信息，交由外层重试处理。
    tools:
      - generate_draft_section
      - assemble_draft_document
      - update_writing_context
    exclude_framework_tools:
      - read_user_attachment
      - find_user_attachment
    inputs:
      - slot: writing_task
        required: true
      - slot: writing_context
        required: true
      - slot: outline
        required: true
      - slot: section_instructions
        required: true
    outputs:
      - slot: draft_sections
      - slot: draft_document
      - slot: writing_context
    acceptance_criteria: |
      draft_sections 已按章节顺序保存，数量与 section_instructions.data.instructions 一致，至少 2 个 DraftSection；每个 DraftSection 含 title 且 blocks 非空，每个 block 的 content 非空。draft_document 已保存一次，draft_document.sections 与 draft_sections 按顺序一一对应；writing_context 已保存一次，document_summary 已反映 draft_document 内容。

  review_document:
    label: Review Document
    prompt: |
      {{runtime_instruction}}

      本步对初稿做一致性与质量审阅。调 get_artifact 取回 writing_context 和 draft_document 的文件路径，然后调用 check_consistency(draft_path=<draft_document 路径>, writing_context_path=<writing_context 路径>)。该工具会返回 review_report（review_report Artifact 文件的绝对路径）和 review_summary（validate_draft_document 输出的内容摘要字符串，非路径）。请分别调用 save_artifact(content_type='file', key='review_report', value=<review_report 路径>) 和 save_artifact(content_type='text', key='review_summary', value=<review_summary 内容>) 完成落库。

      review_summary 的内容决定 next_step 是什么：审阅通过就进 finalize_report 出终稿，没通过就回 plan_sections 重新规划章节。本步骤的最后一次输出按如下格式：“由于 {{review_summary}}，建议下一个step推进到 {{next_step}}”。

      如果上述工具调用失败，停止本步骤并保留工具错误信息，交由外层重试处理。
    tools:
      - check_consistency
    exclude_framework_tools:
      - read_user_attachment
      - find_user_attachment
    inputs:
      - slot: draft_document
        required: true
      - slot: writing_context
        required: true
    outputs:
      - slot: review_report
      - slot: review_summary
    acceptance_criteria: |
      review_report 已保存；result.is_passed 是布尔；result.score 是 0-100 数字；result.summary 是非空字符串；result.issues 是数组，每项含 severity（high/medium/low）、category、description 字段。review_summary 已保存，为 validate_draft_document 输出的内容摘要（非路径）。最后一条消息需要符合“由于 {{review_summary}}，建议下一个step推进到 {{next_step}}”的格式。

  finalize_report:
    label: Finalize Report
    prompt: |
      {{runtime_instruction}}

      本步在审阅完成后产出最终 Markdown 成稿。调 get_artifact 取回 writing_context、draft_document 和 review_report 的文件路径，传给 generate_writing_output(draft_path=<draft_document 路径>, review_report_path=<review_report 路径>, writing_context_path=<writing_context 路径>)。该工具会同时返回两个文件路径：writing_output（结构化 Artifact）和 writing_output_md（最终 Markdown 成稿）。

      本步骤的生成操作完成后，对这两个路径分别调用 save_artifact(content_type='file', key='writing_output') 和 save_artifact(content_type='file', key='writing_output_md') 保存成当前 step 的 artifact。

      如果上述工具调用失败，停止本步骤并保留工具错误信息，交由外层重试处理。
    tools:
      - generate_writing_output
    exclude_framework_tools:
      - read_user_attachment
      - find_user_attachment
    inputs:
      - slot: draft_document
        required: true
      - slot: review_report
        required: true
      - slot: writing_context
        required: true
    outputs:
      - slot: writing_output
      - slot: writing_output_md
    acceptance_criteria: |
      writing_output 已保存；writing_output_md 已保存；output_format 是 markdown；content 是非空字符串，含标题与至少 2 个二级章节（`## ` 开头），正文长度足以独立成篇。

  export_result:
    label: Export Result
    prompt: |
      {{runtime_instruction}}

      本步负责把最终 WritingOutput 写回飞书。调 get_artifact 取回 writing_output 的文件路径，然后调用 export_to_feishu(writing_output_path=<writing_output 路径>, target_hint="{{user_input}}")。

      export_to_feishu 使用 LazyLLM 已有的 write_to_document 能力写回飞书；飞书 OAuth token 由 LazyMind 用户账号配置注入，不需要本插件单独配置。如果当前用户没有配置可用于写回的飞书账号，工具会抛出 FEISHU_ACCOUNT_REQUIRED，本步骤应直接失败，让前端提示用户先配置飞书账号。

      目标位置可以由平台侧用户配置/前端选择解析成 feishu@<space_id>:/目录/标题.md 后传入，或由用户在本轮明确给出该 URI：
      - 用户明确给出 feishu@<space_id>:/目录/标题.md 时，按该 URI 写回；
      - 用户只说“写回飞书”且平台尚未提供默认目标时，临时默认写入飞书云文档根目录，URI 形如 feishu:/标题.md；
      - 遇到权限或授权问题时，工具会返回 permission_required，提醒用户在前端配置飞书账号/权限。

      工具返回 feishu_export_result 路径后，调用 save_artifact(content_type='file', key='feishu_export_result', value=<feishu_export_result 路径>) 保存结果。

      如果工具返回 permission_required，也必须保存 feishu_export_result，不要自行伪造写回成功。
    tools:
      - export_to_feishu
    exclude_framework_tools:
      - read_user_attachment
      - find_user_attachment
    inputs:
      - slot: writing_output
        required: true
    outputs:
      - slot: feishu_export_result
    acceptance_criteria: |
      feishu_export_result 已保存；其 status 为 exported、permission_required、invalid_target 或 failed 之一。status=exported 时包含 uri 与 write_result_path；status=permission_required 时包含可展示给用户的 message。
