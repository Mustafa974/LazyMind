id: writer-plugin
name: AI Writer
description: >
  撰写长篇文章或技术报告。工作流分七步：解析写作意图与边界、
  生成大纲、为每章规划写作指令、撰写全文初稿、审阅初稿并给出修订意见、
  产出最终成稿、写回文档。每一步都支持通过状态机自环进行整体重跑。

when_to_use: >
  当用户希望撰写、起草、生成一篇较长的文章、报告、技术文档、综述、
  说明文或任何结构化长文本时调用本插件。典型请求如「写一篇关于 X 的报告」、
  「帮我起草一份 Y 的技术文章」、「写一篇综述」、「生成一篇关于 Z 的介绍」、
  「请就某主题写一篇文章」等。不适用于单段话的简短改写或翻译。

tool_scripts:
  - path: scripts/tools.py
    functions:
      - build_writing_task
      - profile_resources
      - create_writing_context
      - generate_outline
      - generate_section_instructions
      - generate_draft_section
      - assemble_draft_document
      - update_writing_context
      - check_consistency
      - generate_writing_output
      - export_to_feishu

steps:
  - id: build_context
  - id: generate_outline
  - id: plan_sections
  - id: generate_draft
  - id: review_document
  - id: finalize_report
  - id: export_result

slots:
  - id: writing_task
    label: Writing Task
    type: text
    cardinality: single
  - id: resource_profiles
    label: Resource Profiles
    type: text
    cardinality: single
  - id: writing_context
    label: Writing Context
    type: text
    cardinality: single
    summary_max_chars: 600
  - id: outline
    label: Outline
    type: text
    cardinality: single
  - id: section_instructions
    label: Section Instructions
    type: text
    cardinality: single
  - id: draft_sections
    label: Draft Sections
    type: text
    cardinality: list
    ordered: true
  - id: draft_document
    label: Full Draft
    type: text
    cardinality: single
  - id: review_report
    label: Review Report
    type: text
    cardinality: single
  - id: review_summary
    label: Review Summary
    type: text
    cardinality: single
  - id: writing_output
    label: Final Report
    type: text
    cardinality: single
  - id: writing_output_md
    label: Final Report (Markdown)
    type: file
    cardinality: single
  - id: feishu_export_result
    label: Feishu Export Result
    type: text
    cardinality: single

ui:
  tabs:
    - id: context
      step_id: build_context
      label: Context
      layout: list
      slots:
        - id: writing_task
        - id: resource_profiles
        - id: writing_context

    - id: outline
      step_id: generate_outline
      label: Outline
      layout: list
      slots:
        - id: outline
        - id: writing_context

    - id: plan_sections
      step_id: plan_sections
      label: Plan Sections
      layout: list
      slots:
        - id: section_instructions

    - id: draft
      step_id: generate_draft
      label: Draft
      layout: list
      slots:
        - id: draft_sections
        - id: draft_document
        - id: writing_context

    - id: review
      step_id: review_document
      label: Review
      layout: list
      slots:
        - id: review_report
        - id: review_summary

    - id: result
      step_id: finalize_report
      label: Final Report
      layout: list
      slots:
        - id: writing_output
        - id: writing_output_md

    - id: export
      step_id: export_result
      label: Export Result
      layout: list
      slots:
        - id: feishu_export_result

i18n:
  zh-CN:
    name: AI 写作
    steps:
      build_context: {label: 意图解析}
      generate_outline: {label: 生成大纲}
      plan_sections: {label: 规划章节}
      generate_draft: {label: 撰写初稿}
      review_document: {label: 审阅初稿}
      finalize_report: {label: 最终成稿}
      export_result: {label: 写回文档}
    tabs:
      context: {label: 构造上下文}
      outline: {label: 生成大纲}
      plan_sections: {label: 规划章节}
      draft: {label: 生成初稿}
      review: {label: 审阅初稿}
      result: {label: 最终成稿}
      export: {label: 写回文档}
    slots:
      writing_task: {label: 写作任务}
      resource_profiles: {label: 资源画像}
      writing_context: {label: 写作上下文}
      outline: {label: 大纲}
      section_instructions: {label: 章节规划}
      draft_sections: {label: 章节草稿}
      draft_document: {label: 完整初稿}
      review_report: {label: 审阅报告}
      review_summary: {label: 审阅摘要}
